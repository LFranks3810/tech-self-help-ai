<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentriForge - IT Support & Self-Service Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js CDN for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-blue-500"></i> SentriForge
        </h1>
        <p class="text-xs text-slate-400">IT Help Desk & Self-Service Portal</p>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex gap-2">
        <button id="nav-chat-btn" onclick="switchTab('chat')" class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-500 transition">
          <i class="fa-solid fa-robot mr-1"></i> AI Assistant
        </button>
        <button id="nav-kb-btn" onclick="switchTab('kb')" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          <i class="fa-solid fa-book mr-1"></i> Knowledge Base
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-4xl mx-auto w-full flex-1 p-4 flex flex-col">

    <!-- Tab 1: AI Assistant Chat -->
    <section id="tab-chat" class="flex-1 flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 max-h-[65vh]">
        <div class="flex items-start gap-3">
          <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs">AI</div>
          <div class="bg-slate-800 p-3 rounded-lg max-w-md text-sm text-slate-200">
            Hello! I am your SentriForge assistant. How can I help you troubleshoot your IT issue today?
          </div>
        </div>
      </div>

      <!-- Chat Input Form -->
      <form id="chat-form" class="p-4 border-t border-slate-800 flex gap-2 bg-slate-900/50">
        <input type="text" id="chat-input" placeholder="Type your IT support question..." class="flex-1 px-4 py-2 text-sm text-white bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500" required>
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-paper-plane"></i> Send
        </button>
      </form>
    </section>

    <!-- Tab 2: Knowledge Base -->
    <section id="tab-kb" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-book text-blue-500"></i> IT Knowledge Base
      </h2>
      <div id="kb-articles-list" class="space-y-4">
        <!-- Knowledge base articles will be injected here dynamically -->
      </div>
    </section>

  </main>

  <!-- Frontend Logic -->
  <script>
    // Tab Switching Logic
    function switchTab(tab) {
      const chatTab = document.getElementById('tab-chat');
      const kbTab = document.getElementById('tab-kb');
      const chatBtn = document.getElementById('nav-chat-btn');
      const kbBtn = document.getElementById('nav-kb-btn');

      if (tab === 'chat') {
        chatTab.classList.remove('hidden');
        kbTab.classList.add('hidden');
        chatBtn.className = 'px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-500 transition';
        kbBtn.className = 'px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
      } else {
        kbTab.classList.remove('hidden');
        chatTab.classList.add('hidden');
        kbBtn.className = 'px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-500 transition';
        chatBtn.className = 'px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
      }
    }

    // Append Chat Messages with Copy Buttons
    function appendMessage(sender, text) {
      const chatContainer = document.getElementById('chat-messages');
      if (!chatContainer) return;

      const messageDiv = document.createElement('div');
      messageDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      bubble.className = sender === 'user'
        ? 'bg-blue-600 text-white p-3 rounded-lg max-w-md text-sm'
        : 'bg-slate-800 text-slate-200 p-3 rounded-lg max-w-lg text-sm space-y-2';

      if (sender === 'user') {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = marked.parse(text);
        addCopyButtonsToMessage(bubble);
      }

      messageDiv.appendChild(bubble);
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Inject Copy Buttons into Code Blocks
    function addCopyButtonsToMessage(container) {
      const codeBlocks = container.querySelectorAll('pre');
      codeBlocks.forEach((pre) => {
        if (pre.querySelector('.copy-btn')) return;

        pre.style.position = 'relative';
        const button = document.createElement('button');
        button.className = 'copy-btn absolute top-2 right-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2 py-1 rounded transition';
        button.textContent = 'Copy';

        button.addEventListener('click', () => {
          const codeText = pre.querySelector('code')?.innerText || pre.innerText;
          navigator.clipboard.writeText(codeText).then(() => {
            button.textContent = 'Copied!';
            setTimeout(() => { button.textContent = 'Copy'; }, 2000);
          });
        });

        pre.appendChild(button);
      });
    }

  // Handle Chat Form Submission
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;

  chatInput.value = '';
  await handleUserSubmit(message);
});

async function handleUserSubmit(userText) {
  // 1. Render user message
  appendMessage('user', userText);

  // 2. Add temporary typing indicator
  const chatContainer = document.getElementById('chat-messages');
  const loadingDiv = document.createElement('div');
  loadingDiv.id = 'typing-indicator';
  loadingDiv.className = 'flex justify-start my-2';
  loadingDiv.innerHTML = `
    <div class="bg-slate-800 text-slate-400 p-3 rounded-lg text-xs italic">
      <i class="fa-solid fa-spinner fa-spin mr-1"></i> SentriForge AI is thinking...
    </div>
  `;
  chatContainer.appendChild(loadingDiv);
  chatContainer.scrollTop = chatContainer.scrollHeight;

  try {
    // 3. Request dynamic answer from backend
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: userText })
    });
    
    const data = await res.json();

    // 4. Remove typing indicator
    document.getElementById('typing-indicator')?.remove();

    if (res.ok && data.reply) {
      appendMessage('bot', data.reply);
    } else {
      appendMessage('bot', `Error: ${data.error || 'Failed to get response from AI.'}`);
    }
  } catch (err) {
    document.getElementById('typing-indicator')?.remove();
    appendMessage('bot', 'Error: Could not connect to AI assistant server.');
  }
}

    // Query AI directly by clicking a KB Card
    function queryKBAI(title) {
      switchTab('chat');
      handleUserSubmit(`How do I handle or resolve: ${title}?`);
    }

    // Initialize Knowledge Base on page load
    loadKnowledgeBase();
  </script>
</body>
</html>
